name: pet_tracker
description: Real-time GPS monitoring and safety management for pets (MVP with mock GPS).
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  web: ^1.1.2
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
