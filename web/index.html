<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Monitoreo GPS y seguridad para tus mascotas.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PetTracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PetTracker</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pantalla de carga en HTML/CSS puro (CSR).
    La app se dibuja en el cliente: el navegador primero descarga y ejecuta el
    JavaScript de Flutter. Para no mostrar una página en blanco mientras tanto,
    este bloque se pinta de inmediato (mejora el First Contentful Paint) y se
    quita solo cuando Flutter dibuja su primer frame.
  -->
  <style>
    #pt-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #F4F6F3; font-family: system-ui, -apple-system, sans-serif;
      color: #1F2B29; transition: opacity .35s ease; z-index: 9999; }
    #pt-splash .paw { width: 96px; height: 96px; border-radius: 50%; background: #2FB592; display: grid;
      place-items: center; animation: pt-pulse 1.6s ease-out infinite; }
    #pt-splash .paw svg { width: 46px; height: 46px; fill: #fff; }
    #pt-splash p { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .2px; }
    @keyframes pt-pulse { 0% { box-shadow: 0 0 0 0 rgba(47,181,146,.45); } 100% { box-shadow: 0 0 0 36px rgba(47,181,146,0); } }
    @media (prefers-color-scheme: dark) { #pt-splash { background: #121816; color: #E7EEEB; } }
    @media (prefers-reduced-motion: reduce) { #pt-splash .paw { animation: none; } }
  </style>
</head>
<body>
  <div id="pt-splash" aria-hidden="true">
    <div class="paw">
      <svg viewBox="0 0 24 24"><path d="M4.5 9.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm4.5-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm4.5 3a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17.3 14.9c-.9-1-1.6-1.9-2.4-2.9-.4-.5-.9-1-1.5-1.2-.4-.1-.8-.1-1.2 0-.6.2-1.1.7-1.5 1.2-.8 1-1.5 1.9-2.4 2.9-1.3 1.3-2.9 2.8-2.6 4.8.3 1 1 2 2.2 2.3.8.1 3.4-.6 6.1-.6h.2c2.7 0 5.3.7 6.1.6 1.2-.3 2-1.3 2.2-2.3.3-2-1.3-3.5-2.6-4.8z"/></svg>
    </div>
    <p>PetTracker</p>
  </div>
  <script>
    // Se quita la pantalla de carga cuando Flutter dibuja su primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('pt-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
    // Service Worker de PetTracker (mapa y sonidos sin internet).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('pettracker_sw.js').catch(function (e) {
          console.warn('Service Worker no registrado:', e);
        });
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
